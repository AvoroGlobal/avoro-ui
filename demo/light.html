<!DOCTYPE html>
<html lang="en" data-avoro-surface="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Demo — Light Theme — @avoroglobal/ui</title>
  <link rel="stylesheet" href="/node_modules/@avoroglobal/brand-tokens/dist/css-variables.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--avoro-font-sans);
      background: var(--avoro-surface-page);
      color: var(--avoro-text-primary);
      padding: 40px;
    }
    .demo-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      font-family: var(--avoro-font-display);
      font-size: var(--avoro-size-h2);
      margin-bottom: 40px;
      color: var(--avoro-text-primary);
    }
    .theme-label {
      font-family: var(--avoro-font-mono);
      font-size: var(--avoro-size-caption);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
      opacity: 0.7;
      color: var(--avoro-text-muted);
    }
    .variant-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .variant-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .variant-label {
      font-family: var(--avoro-font-mono);
      font-size: var(--avoro-size-micro);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.6;
      margin-bottom: 8px;
      color: var(--avoro-text-muted);
    }
    .size-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .size-label {
      width: 24px;
      font-family: var(--avoro-font-mono);
      font-size: var(--avoro-size-micro);
      opacity: 0.5;
      color: var(--avoro-text-muted);
    }
    /* Button base styles — using semantic tokens */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 500;
      font-family: var(--avoro-font-display);
      border-radius: var(--avoro-radius-md);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
      outline: none;
      border: none;
    }
    .btn:focus-visible {
      box-shadow: var(--avoro-focus-ring);
    }
    /* Primary — identical in both themes */
    .btn-primary {
      background: var(--avoro-interactive-primary-bg);
      color: var(--avoro-interactive-primary-fg);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--avoro-interactive-primary-hover);
    }
    .btn-primary:active:not(:disabled) {
      background: var(--avoro-interactive-primary-active);
      color: var(--avoro-interactive-primary-active-fg);
    }
    /* Secondary — semantic tokens */
    .btn-secondary {
      background: transparent;
      color: var(--avoro-interactive-secondary-fg);
      border: 1px solid var(--avoro-border-default);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--avoro-interactive-secondary-hover-bg);
    }
    /* Ghost — semantic tokens */
    .btn-ghost {
      background: transparent;
      color: var(--avoro-text-primary);
    }
    .btn-ghost:hover:not(:disabled) {
      background: var(--avoro-interactive-secondary-hover-bg);
    }
    /* Inverse — semantic tokens (auto-flips) */
    .btn-inverse {
      background: var(--avoro-surface-flip);
      color: var(--avoro-text-inverse);
    }
    /* Disabled */
    .btn:disabled {
      background: var(--avoro-interactive-disabled-bg) !important;
      color: var(--avoro-interactive-disabled-fg) !important;
      border: none !important;
      cursor: not-allowed;
      pointer-events: none;
    }
    /* Sizes */
    .btn-sm { height: 32px; padding: 0 12px; font-size: 14px; }
    .btn-md { height: 40px; padding: 0 16px; font-size: 15px; }
    .btn-lg { height: 48px; padding: 0 20px; font-size: 16px; }
    /* Loading spinner */
    .spinner {
      width: 16px;
      height: 16px;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1>Button Component — Light Theme</h1>
    <div class="theme-label">Light Theme</div>
    <div class="variant-grid">
      <!-- Primary -->
      <div class="variant-column">
        <div class="variant-label">Primary</div>
        <div class="size-row"><span class="size-label">sm</span><button class="btn btn-primary btn-sm">Button</button></div>
        <div class="size-row"><span class="size-label">md</span><button class="btn btn-primary btn-md">Button</button></div>
        <div class="size-row"><span class="size-label">lg</span><button class="btn btn-primary btn-lg">Button</button></div>
        <div class="size-row"><span class="size-label">sm</span><button class="btn btn-primary btn-sm" disabled>Disabled</button></div>
        <div class="size-row"><span class="size-label">md</span><button class="btn btn-primary btn-md" disabled>Disabled</button></div>
        <div class="size-row"><span class="size-label">lg</span><button class="btn btn-primary btn-lg" disabled>Disabled</button></div>
        <div class="size-row"><span class="size-label">sm</span><button class="btn btn-primary btn-sm"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading</button></div>
        <div class="size-row"><span class="size-label">md</span><button class="btn btn-primary btn-md"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading</button></div>
        <div class="size-row"><span class="size-label">lg</span><button class="btn btn-primary btn-lg"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading</button></div>
      </div>
      
      <!-- Secondary -->
      <div class="variant-column">
        <div class="variant-label">Secondary</div>
        <div class="size-row"><span class="size-label">sm</span><button class="btn btn-secondary btn-sm">Button</button></div>
        <div class="size-row"><span class="size-label">md</span><button class="btn btn-secondary btn-md">Button</button></div>
        <div class="size-row"><span class="size-label">lg</span><button class="btn btn-secondary btn-lg">Button</button></div>
        <div class="size-row"><span class="size-label">sm</span><button class="btn btn-secondary btn-sm" disabled>Disabled</button></div>
        <div class="size-row"><span class="size-label">md</span><button class="btn btn-secondary btn-md" disabled>Disabled</button></div>
        <div class="size-row"><span class="size-label">lg</span><button class="btn btn-secondary btn-lg" disabled>Disabled</button></div>
        <div class="size-row"><span class="size-label">sm</span><button class="btn btn-secondary btn-sm"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading</button></div>
        <div class="size-row"><span class="size-label">md</span><button class="btn btn-secondary btn-md"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading</button></div>
        <div class="size-row"><span class="size-label">lg</span><button class="btn btn-secondary btn-lg"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading</button></div>
      </div>
      
      <!-- Ghost -->
      <div class="variant-column">
        <div class="variant-label">Ghost</div>
        <div class="size-row"><span class="size-label">sm</span><button class="btn btn-ghost btn-sm">Button</button></div>
        <div class="size-row"><span class="size-label">md</span><button class="btn btn-ghost btn-md">Button</button></div>
        <div class="size-row"><span class="size-label">lg</span><button class="btn btn-ghost btn-lg">Button</button></div>
        <div class="size-row"><span class="size-label">sm</span><button class="btn btn-ghost btn-sm" disabled>Disabled</button></div>
        <div class="size-row"><span class="size-label">md</span><button class="btn btn-ghost btn-md" disabled>Disabled</button></div>
        <div class="size-row"><span class="size-label">lg</span><button class="btn btn-ghost btn-lg" disabled>Disabled</button></div>
        <div class="size-row"><span class="size-label">sm</span><button class="btn btn-ghost btn-sm"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading</button></div>
        <div class="size-row"><span class="size-label">md</span><button class="btn btn-ghost btn-md"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading</button></div>
        <div class="size-row"><span class="size-label">lg</span><button class="btn btn-ghost btn-lg"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading</button></div>
      </div>
      
      <!-- Inverse -->
      <div class="variant-column">
        <div class="variant-label">Inverse</div>
        <div class="size-row"><span class="size-label">sm</span><button class="btn btn-inverse btn-sm">Button</button></div>
        <div class="size-row"><span class="size-label">md</span><button class="btn btn-inverse btn-md">Button</button></div>
        <div class="size-row"><span class="size-label">lg</span><button class="btn btn-inverse btn-lg">Button</button></div>
        <div class="size-row"><span class="size-label">sm</span><button class="btn btn-inverse btn-sm" disabled>Disabled</button></div>
        <div class="size-row"><span class="size-label">md</span><button class="btn btn-inverse btn-md" disabled>Disabled</button></div>
        <div class="size-row"><span class="size-label">lg</span><button class="btn btn-inverse btn-lg" disabled>Disabled</button></div>
        <div class="size-row"><span class="size-label">sm</span><button class="btn btn-inverse btn-sm"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading</button></div>
        <div class="size-row"><span class="size-label">md</span><button class="btn btn-inverse btn-md"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading</button></div>
        <div class="size-row"><span class="size-label">lg</span><button class="btn btn-inverse btn-lg"><svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading</button></div>
      </div>
    </div>
  </div>
</body>
</html>
